<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Desafio Tema 01 • 20 Questões Gamificadas</title>
<style>
:root{
  --bg:#080d1a; --surface:#121a2d; --surface-card:#18243c; --surface-hover:#223252;
  --primary:#38bdf8; --primary-dark:#0284c7; --accent:#f59e0b; --accent-orange:#ea580c;
  --purple:#8b5cf6; --pink:#ec4899; --ok:#10b981; --ok-bg:#064e3b; --ok-text:#ecfdf5;
  --no:#ef4444; --no-bg:#450a0a; --no-text:#fef2f2;
  --text:#f8fafc; --text-muted:#cbd5e1; --border:#2a3854; --border-focus:#38bdf8;
  --radius:16px; --trans:all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 10% 10%,#1e1b4b 0%,var(--bg) 65%);
  color:var(--text);min-height:100vh;padding:20px 14px 80px;line-height:1.6;}
.container{max-width:960px;margin:0 auto;}
.hud-header{background:#0f172a;border:2px solid var(--border);border-radius:var(--radius);
  padding:20px 24px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);
  position:sticky;top:10px;z-index:100;}
.hud-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hud-title h1{font-size:1.35rem;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px;}
.hud-title h1 span{color:var(--primary);}
.hud-title p{font-size:0.84rem;color:var(--text-muted);}
.stats-bar{display:flex;gap:10px;align-items:center;}
.stat-chip{background:#1e293b;border:1px solid var(--border);padding:6px 14px;border-radius:30px;font-size:0.82rem;font-weight:800;}
.stat-chip.score{color:#fbbf24;border-color:rgba(251,191,36,0.5);}
.stat-chip.streak{color:#f472b6;border-color:rgba(244,114,182,0.5);}
.hud-progress{margin-top:14px;}
.progress-meta{display:flex;justify-content:space-between;font-size:0.78rem;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
.progress-track{height:10px;background:#090e17;border-radius:20px;overflow:hidden;border:1px solid var(--border);}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--purple),var(--pink));transition:width 0.3s ease;}
.nav-dots{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 14px;margin-bottom:18px;scrollbar-width:thin;}
.nav-dot{width:30px;height:30px;border-radius:50%;background:#1e293b;border:2px solid var(--border);color:#cbd5e1;font-size:0.72rem;font-weight:800;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--trans);font-family:inherit;}
.nav-dot:hover{border-color:var(--primary);color:#fff;}
.nav-dot.active{background:var(--primary-dark);color:#fff;border-color:#7dd3fc;box-shadow:0 0 12px rgba(56,189,248,0.6);}
.nav-dot.done-ok{background:var(--ok-bg);border-color:var(--ok);color:#a7f3d0;}
.nav-dot.done-no{background:var(--no-bg);border-color:var(--no);color:#fca5a5;}
.question-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:0 10px 30px rgba(0,0,0,0.4);display:none;}
.question-card.active{display:block;animation:fadeIn 0.25s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.q-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(56,189,248,0.15);border:1px solid var(--primary);color:#7dd3fc;font-size:0.76rem;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;padding:5px 14px;border-radius:20px;margin-bottom:14px;}
.q-statement{font-size:1.12rem;font-weight:700;color:#fff;line-height:1.6;margin-bottom:12px;}
.q-subtext{font-size:0.9rem;color:var(--text-muted);margin-bottom:16px;background:rgba(255,255,255,0.03);padding:8px 12px;border-radius:8px;border-left:3px solid var(--accent);}
code{background:#090e17;color:#38bdf8;padding:3px 8px;border-radius:6px;font-family:'Courier New',monospace;font-weight:700;font-size:0.9em;border:1px solid #1e293b;}
.options-grid{display:flex;flex-direction:column;gap:10px;margin:16px 0;}
.opt-btn{background:var(--surface-card);border:2px solid var(--border);color:var(--text);border-radius:10px;padding:14px 18px;font-size:0.95rem;text-align:left;cursor:pointer;transition:var(--trans);display:flex;align-items:center;gap:12px;font-family:inherit;}
.opt-btn:hover:not(:disabled){background:var(--surface-hover);border-color:var(--primary);transform:translateX(4px);}
.opt-btn.selected-multi{border-color:var(--primary);background:rgba(56,189,248,0.18);box-shadow:0 0 10px rgba(56,189,248,0.25);}
.opt-btn.correct{background:var(--ok-bg)!important;border-color:var(--ok)!important;color:var(--ok-text)!important;}
.opt-btn.wrong{background:var(--no-bg)!important;border-color:var(--no)!important;color:var(--no-text)!important;}
.opt-btn.missed{border-color:#f59e0b!important;border-style:dashed!important;background:rgba(245,158,11,0.12)!important;}
.opt-btn:disabled{cursor:default;}
.input-answer-box{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;}
.custom-input{flex:1;min-width:220px;padding:13px 16px;background:#090e17;border:2px solid var(--border);border-radius:8px;color:#fff;font-family:inherit;font-size:1rem;outline:none;transition:var(--trans);}
.custom-input::placeholder{color:#64748b;}
.custom-input:focus{border-color:var(--border-focus);box-shadow:0 0 10px rgba(56,189,248,0.3);}
.custom-input:disabled{background:#0d1524!important;color:#fff!important;opacity:1!important;border-color:#475569!important;}
.sortable-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.sort-item{background:var(--surface-card);border:1px solid var(--border);padding:12px 16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:0.92rem;font-weight:700;color:#fff;gap:10px;}
.sort-actions{display:flex;gap:6px;}
.btn-sort{background:#0f172a;border:1px solid var(--border);color:#f8fafc;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:bold;font-family:inherit;}
.btn-sort:hover:not(:disabled){color:var(--primary);border-color:var(--primary);}
.btn-sort:disabled{opacity:0.4;cursor:not-allowed;}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
.match-col{display:flex;flex-direction:column;gap:8px;}
.match-btn{background:var(--surface-card);border:2px solid var(--border);color:var(--text);padding:12px 14px;border-radius:8px;font-size:0.88rem;font-weight:600;cursor:pointer;text-align:left;transition:var(--trans);font-family:inherit;min-height:52px;}
.match-btn.selected{border-color:var(--accent);background:rgba(245,158,11,0.2);}
.match-btn.matched{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-text);cursor:default;}
.match-btn.temp-wrong{border-color:var(--no);background:var(--no-bg);color:var(--no-text);animation:shake 0.4s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.buckets-container{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
.bucket{background:#0b1120;border:2px dashed #475569;border-radius:10px;padding:16px;min-height:130px;cursor:pointer;}
.bucket:hover{border-color:var(--primary);background:#0f182c;}
.bucket-title{font-size:0.84rem;font-weight:800;color:var(--primary);margin-bottom:10px;text-transform:uppercase;}
.bucket-items{display:flex;flex-direction:column;gap:8px;min-height:50px;}
.bucket-pool{background:#090e17;border:1px solid var(--border);padding:14px;border-radius:8px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;}
.chip-item{background:#1e293b;border:1px solid #334155;color:#f8fafc;padding:7px 14px;border-radius:20px;font-size:0.84rem;font-weight:700;cursor:pointer;transition:var(--trans);}
.chip-item.active-chip{border-color:var(--accent);background:var(--accent-orange);color:#fff;box-shadow:0 0 10px rgba(234,88,12,0.4);}
.code-error-box{background:#060911;border:2px solid var(--border);border-radius:10px;padding:10px 0;margin:14px 0;font-family:'Courier New',monospace;font-size:0.9rem;}
.code-line{padding:8px 18px;cursor:pointer;display:flex;gap:14px;transition:var(--trans);color:#f8fafc;align-items:flex-start;}
.code-line:hover:not(.locked){background:#162032;}
.code-line.selected-err{background:var(--no-bg);border-left:5px solid var(--no);color:#fee2e2;}
.code-line.locked{cursor:default;}
.line-no{color:#64748b;user-select:none;width:20px;text-align:right;flex-shrink:0;}
.evolution-hotspot{background:#070c18;border:2px solid var(--border);border-radius:12px;padding:20px;margin:16px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.evo-card{background:#111827;border:2px solid #1f2937;border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;transition:var(--trans);}
.evo-card:hover{border-color:var(--primary);transform:translateY(-2px);}
.evo-card.picked{border-color:#facc15;box-shadow:0 0 14px rgba(250,204,21,0.6);}
.evo-card.picked.ok{border-color:var(--ok);box-shadow:0 0 14px rgba(16,185,129,0.6);}
.evo-card.picked.no{border-color:var(--no);box-shadow:0 0 14px rgba(239,68,68,0.6);}
.evo-card .emoji{font-size:1.7rem;display:block;margin-bottom:4px;}
.evo-card .titulo{font-size:0.82rem;font-weight:800;color:#fff;display:block;}
.evo-card .periodo{font-size:0.7rem;color:#94a3b8;margin-top:2px;display:block;}
.feedback-box{display:none;border-radius:10px;padding:16px 20px;margin-top:18px;font-size:0.92rem;line-height:1.6;}
.feedback-box.show{display:block;animation:fadeIn 0.2s ease-out;}
.feedback-box.ok{background:var(--ok-bg);border-left:5px solid var(--ok);color:var(--ok-text);}
.feedback-box.no{background:var(--no-bg);border-left:5px solid var(--no);color:var(--no-text);}
.feedback-box.warn{background:rgba(245,158,11,0.15);border-left:5px solid var(--accent);color:#fef3c7;}
.q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--border);gap:10px;flex-wrap:wrap;}
.btn-action{background:linear-gradient(135deg,var(--primary-dark),#2563eb);color:#fff;border:none;padding:12px 26px;border-radius:30px;font-size:0.9rem;font-weight:800;cursor:pointer;transition:var(--trans);display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.btn-action:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(2,132,199,0.5);}
.btn-action:disabled{opacity:0.45;cursor:not-allowed;}
.btn-sec{background:#1e293b;border:1px solid var(--border);color:#cbd5e1;}
.btn-sec:hover{color:#fff;border-color:var(--primary);}
select.gap-select{background:#0d1524;color:#38bdf8;border:2px solid #38bdf8;padding:5px 10px;border-radius:6px;font-family:monospace;font-weight:bold;font-size:0.95rem;}
select.gap-select option{background:#0d1524;color:#f8fafc;}
select.gap-select:disabled{opacity:0.7;cursor:not-allowed;}
.report-card{display:none;background:var(--surface);border:2px solid var(--primary-dark);border-radius:var(--radius);padding:34px 28px;text-align:center;}
.report-card.show{display:block;animation:fadeIn 0.3s ease;}
.report-score{font-size:3.5rem;font-weight:900;color:var(--primary);margin:10px 0;}
.report-textarea{width:100%;height:180px;background:#070c16;border:1px solid var(--border);border-radius:8px;padding:12px;color:#e2e8f0;font-family:monospace;font-size:0.82rem;margin:16px 0;resize:vertical;}
@media (max-width:768px){
  .match-grid,.buckets-container{grid-template-columns:1fr;}
  .hud-top{flex-direction:column;align-items:flex-start;}
  .question-card{padding:20px 14px;}
  .evolution-hotspot{grid-template-columns:repeat(2,1fr);}
  .hud-header{position:static;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>
<div class="container">
  <header class="hud-header">
    <div class="hud-top">
      <div class="hud-title">
        <h1>🎮 Desafio <span>Tema 01</span></h1>
        <p>Evolução da Gestão de Conteúdo Web • 20 questões gamificadas</p>
      </div>
      <div class="stats-bar">
        <div class="stat-chip score">⚡ <span id="val-score">0</span> pts</div>
        <div class="stat-chip streak">🔥 Combo <span id="val-streak">0</span>x</div>
      </div>
    </div>
    <div class="hud-progress">
      <div class="progress-meta">
        <span>Progresso Geral</span>
        <span id="txt-prog">Questão 1 de 20</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" id="bar-aria">
        <div class="progress-fill" id="bar-prog"></div>
      </div>
    </div>
  </header>

  <nav class="nav-dots" id="dots-container" aria-label="Navegador de Questões" role="tablist"></nav>

  <main id="questions-viewport"></main>

  <section class="report-card" id="final-report" aria-live="polite">
    <h2>🏆 Desafio Concluído!</h2>
    <p style="color:var(--text-muted); margin-top:4px;">Confira seu desempenho nas 20 questões do Tema 01</p>
    <div class="report-score" id="final-score-txt">0 / 20</div>
    <p id="final-feedback-badge" style="font-size:1.15rem; font-weight:800; margin-bottom:14px;"></p>
    <textarea class="report-textarea" id="report-copy-box" readonly aria-label="Relatório do desafio"></textarea>
    <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
      <button type="button" class="btn-action" id="btn-copy-rep">📋 Copiar Resumo</button>
      <button type="button" class="btn-action btn-sec" id="btn-revisar">🔍 Revisar Questões</button>
      <button type="button" class="btn-action btn-sec" id="btn-reiniciar">🔄 Reiniciar Desafio</button>
    </div>
  </section>
</div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTexto" style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px;backdrop-filter:blur(2px);">
  <div style="background:var(--surface);border:2px solid var(--primary);border-radius:14px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.6);">
    <p id="modalTexto" style="color:var(--text);font-size:.95rem;margin-bottom:18px;line-height:1.6;"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button type="button" class="btn-action btn-sec" id="modalCancelar">Cancelar</button>
      <button type="button" class="btn-action" id="modalConfirmar">Confirmar</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ==================== UTILITÁRIOS ==================== */
  function escapeHTML(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function normalizeText(str){
    return String(str).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^\w\s]/g,' ').replace(/\s+/g,' ').trim();
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function shuffleDifferent(arr, comparator){
    var tries = 0;
    var out = shuffle(arr);
    while(tries < 10 && comparator(out)){
      out = shuffle(arr);
      tries++;
    }
    return out;
  }

  var modalResolve = null;
  function abrirModal(msg){
    document.getElementById('modalTexto').textContent = msg;
    document.getElementById('modalOverlay').style.display = 'flex';
    document.getElementById('modalConfirmar').focus();
    return new Promise(function(resolve){ modalResolve = resolve; });
  }
  function fecharModal(v){
    document.getElementById('modalOverlay').style.display = 'none';
    if(modalResolve){ modalResolve(v); modalResolve = null; }
  }
  document.getElementById('modalConfirmar').addEventListener('click', function(){ fecharModal(true); });
  document.getElementById('modalCancelar').addEventListener('click', function(){ fecharModal(false); });
  document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target === this) fecharModal(false); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && document.getElementById('modalOverlay').style.display === 'flex') fecharModal(false);
  });

  /* ==================== DATABASE ==================== */
  var DATABASE = [
    { id:1, type:"choice", badge:"1. Múltipla Escolha • Evolução",
      title:"Segundo a apostila, como a gestão de conteúdo era caracterizada no início da era da internet?",
      options:[
        { t:"Pela personalização avançada e interatividade em tempo real.", ok:false },
        { t:"Pela simplicidade dos sites estáticos, com foco em texto e imagens básicas.", ok:true },
        { t:"Pelo uso intenso de inteligência artificial.", ok:false },
        { t:"Por algoritmos de busca avançados.", ok:false }
      ],
      exp:"A apostila diz: 'a gestão de conteúdo era caracterizada pela simplicidade dos sites estáticos, onde o foco estava em transmitir informações básicas por meio de texto e imagens'."
    },
    { id:2, type:"tf", badge:"2. Verdadeiro ou Falso • CMS",
      title:"Segundo a apostila, os CMS tornaram a gestão de conteúdo acessível a uma variedade maior de pessoas, impulsionando blogs, fóruns e comunidades.",
      ok:true,
      exp:"Verdadeiro! A apostila afirma que 'permitiu que uma variedade maior de pessoas criasse e compartilhasse conteúdo, impulsionando a criação de blogs, fóruns e comunidades online'."
    },
    { id:3, type:"multi", badge:"3. Múltiplas Respostas • Desafios",
      title:"Quais dos itens abaixo a apostila lista como DESAFIOS AVANÇADOS na gestão de conteúdo web? (Selecione todos)",
      options:[
        { t:"Saturação de conteúdo", ok:true },
        { t:"Mudanças algorítmicas", ok:true },
        { t:"Falta de eletricidade nos servidores", ok:false },
        { t:"Métricas de desempenho complexas", ok:true }
      ],
      exp:"A apostila lista 6 desafios: saturação de conteúdo, mudanças algorítmicas, personalização demanda precisão, diversificação de plataformas, evolução tecnológica e métricas complexas."
    },
    { id:4, type:"typed", badge:"4. Resposta Digitada • Personas",
      title:"Segundo a apostila, <strong>público-alvo</strong> representa um grupo demográfico amplo. E <strong>personas</strong> são o quê? Digite a palavra-chave que caracteriza a persona.",
      sub:"Dica: a apostila usa uma expressão específica. Digite apenas a palavra (ex: personagens):",
      answer:"personagens",
      exp:"A apostila diz que persona são 'personagens fictícios que incorporam características, motivações e desafios do público-alvo específico'."
    },
    { id:5, type:"number", badge:"5. Resposta Numérica • Métricas",
      title:"Segundo a apostila, quantas MÉTRICAS AVANÇADAS são listadas na seção de Métricas e Análise de Dados?",
      sub:"Informe apenas o número:",
      answer:9,
      exp:"São 9: Taxa de Conversão por Segmento, Análise de Funil, Tempo de Permanência por Conteúdo, Taxa de Rejeição por Página, Taxa de Compartilhamento Social, Engajamento em Dispositivos Móveis, Testes A/B, Análise de Palavras-Chave e Taxa de Conversão por Canal de Marketing."
    },
    { id:6, type:"sort", badge:"6. Ordenação • Evolução Histórica",
      title:"Ordene os 4 grandes marcos da evolução da gestão de conteúdo web, conforme a apostila (do mais antigo ao mais recente):",
      items:[
        "Sites estáticos (simplicidade, texto e imagem)",
        "CMS + redes sociais (democratização da publicação)",
        "Motores de busca e SEO + dispositivos móveis (responsividade)",
        "IA, personalização e redes sociais dominantes (era atual)"
      ],
      correctOrder:[0,1,2,3],
      exp:"Essa é a sequência narrativa da apostila: estático → CMS/redes sociais → SEO + mobile → IA e personalização."
    },
    { id:7, type:"match", badge:"7. Associação • Pilares do SEO",
      title:"Associe cada termo de SEO avançado à sua definição, conforme a apostila:",
      pairs:[
        { left:"Cauda longa", right:"Palavras-chave específicas e mais direcionadas" },
        { left:"LSI", right:"Variações semânticas que reforçam o tema" },
        { left:"Intenção de busca", right:"O que o usuário quer ao digitar a consulta" }
      ],
      exp:"A apostila lista cauda longa (mais específicas), LSI (conteúdo natural) e intenção de busca (respostas relevantes e completas)."
    },
    { id:8, type:"buckets", badge:"8. Classificação • Desafios × Oportunidades",
      title:"Classifique cada item como DESAFIO ou OPORTUNIDADE avançada, conforme a apostila:",
      buckets:["Desafio","Oportunidade"],
      items:[
        { text:"Saturação de conteúdo", b:0 },
        { text:"Experiência do usuário aprimorada", b:1 },
        { text:"Mudanças algorítmicas", b:0 },
        { text:"Expansão global", b:1 }
      ],
      exp:"Saturação e mudanças algorítmicas são desafios. Experiência aprimorada e expansão global são oportunidades."
    },
    { id:9, type:"gap", badge:"9. Completar Lacunas • SEO",
      title:"Complete o trecho conforme a apostila descreve o uso de palavras-chave LSI:",
      snippet:'O uso de palavras-chave <b>LSI</b> ajuda a criar conteúdo mais natural e <b>_____1_____</b>.',

  var curQ = 0, score = 0, streak = 0;
  var userAnswers = {};
  var multiState = {};
  var matchState = {};
  var bucketState = {};

  /* ==================== HUD ==================== */
  function updateHUD(){
    document.getElementById('val-score').textContent = score;
    document.getElementById('val-streak').textContent = streak;
    var answeredCount = Object.keys(userAnswers).length;
    document.getElementById('txt-prog').textContent = 'Questão ' + (curQ + 1) + ' de ' + DATABASE.length + ' (' + answeredCount + ' respondidas)';
    document.getElementById('bar-prog').style.width = ((answeredCount / DATABASE.length) * 100) + '%';
    document.getElementById('bar-aria').setAttribute('aria-valuenow', String(answeredCount));
  }

  /* ==================== NAV DOTS ==================== */
  function renderNavDots(){
    var container = document.getElementById('dots-container');
    container.innerHTML = '';
    DATABASE.forEach(function(q, idx){
      var dot = document.createElement('button');
      dot.className = 'nav-dot';
      dot.id = 'dot-' + idx;
      dot.textContent = idx + 1;
      dot.setAttribute('role','tab');
      dot.setAttribute('aria-label','Ir para questão ' + (idx + 1));
      dot.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
      dot.addEventListener('click', function(){ showQuestion(idx); });
      container.appendChild(dot);
    });
  }

  function showQuestion(idx){
    curQ = idx;
    document.querySelectorAll('.question-card').forEach(function(c){ c.classList.remove('active'); });
    var target = document.getElementById('q-card-' + idx);
    if(target) target.classList.add('active');
    document.querySelectorAll('.nav-dot').forEach(function(d){
      d.classList.remove('active');
      d.setAttribute('aria-selected','false');
    });
    var dot = document.getElementById('dot-' + idx);
    if(dot){
      dot.classList.add('active');
      dot.setAttribute('aria-selected','true');
      dot.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }
    updateHUD();
  }

  /* ==================== RENDER ==================== */
  function renderAllQuestions(){
    var viewport = document.getElementById('questions-viewport');

      var card = document.createElement('section');

      card.id = 'q-card-' + idx;

      var bodyHTML = '';

      card.innerHTML =

  /* ==================== BIND DE EVENTOS ==================== */
  function bindAllEvents(){
    // Choice
    document.querySelectorAll('.opt-btn[data-o]').forEach(function(btn){
      btn.addEventListener('click', function(){ checkChoice(parseInt(btn.dataset.q,10), parseInt(btn.dataset.o,10)); });
    });
    // TF
    document.querySelectorAll('.opt-btn[data-v]').forEach(function(btn){
      btn.addEventListener('click', function(){ checkTF(parseInt(btn.dataset.q,10), btn.dataset.v === 'true'); });
    });
    // Multi toggle
    document.querySelectorAll('.opt-btn[data-multi]').forEach(function(btn){
      btn.addEventListener('click', function(){ toggleMulti(parseInt(btn.dataset.q,10), parseInt(btn.dataset.multi,10)); });
    });
    // Multi confirm
    document.querySelectorAll('[data-role="input-confirm"], [data-role="sort-check"], [data-role="bucket-check"], [data-role="gap-check"], #multi-confirm-' + 0).forEach(function(){});
    document.querySelectorAll('button[id^="multi-confirm-"]').forEach(function(btn){
      btn.addEventListener('click', function(){ checkMulti(parseInt(btn.dataset.q,10)); });
    });
    // Input confirm
    document.querySelectorAll('[data-role="input-confirm"]').forEach(function(btn){
      btn.addEventListener('click', function(){ checkInput(parseInt(btn.dataset.q,10)); });
    });
    // Input Enter
    document.querySelectorAll('.custom-input').forEach(function(inp){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ checkInput(parseInt(inp.dataset.q,10)); }
      });
    });
    // Sort buttons
    document.querySelectorAll('.btn-sort').forEach(function(btn){
      btn.addEventListener('click', function(){
        moveSort(parseInt(btn.dataset.q,10), parseInt(btn.dataset.pos,10), parseInt(btn.dataset.dir,10));
      });
    });
    document.querySelectorAll('[data-role="sort-check"]').forEach(function(btn){
      btn.addEventListener('click', function(){ checkSort(parseInt(btn.dataset.q,10)); });
    });
    // Match
    document.querySelectorAll('.match-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        clickMatch(parseInt(btn.dataset.q,10), btn.dataset.side, btn.dataset.side === 'l' ? parseInt(btn.dataset.idx,10) : btn.dataset.val);
      });
    });
    // Buckets chips
    document.querySelectorAll('.chip-item').forEach(function(chip){
      chip.addEventListener('click', function(){ pickChip(parseInt(chip.dataset.q,10), parseInt(chip.dataset.chip,10)); });
    });
    // Bucket drop
    document.querySelectorAll('.bucket').forEach(function(bucket){
      bucket.addEventListener('click', function(){ placeChip(parseInt(bucket.dataset.q,10), parseInt(bucket.dataset.bucket,10)); });
      bucket.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); placeChip(parseInt(bucket.dataset.q,10), parseInt(bucket.dataset.bucket,10)); }
      });
    });
    document.querySelectorAll('[data-role="bucket-check"]').forEach(function(btn){
      btn.addEventListener('click', function(){ checkBuckets(parseInt(btn.dataset.q,10)); });
    });
    // Gap
    document.querySelectorAll('[data-role="gap-check"]').forEach(function(btn){
      btn.addEventListener('click', function(){ checkGap(parseInt(btn.dataset.q,10)); });
    });
    // Hotspot
    document.querySelectorAll('.evo-card').forEach(function(el){
      el.addEventListener('click', function(){ clickHotspot(parseInt(el.dataset.q,10), el.dataset.era, el); });
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickHotspot(parseInt(el.dataset.q,10), el.dataset.era, el); }
      });
    });
    // Errorcode
    document.querySelectorAll('.code-line').forEach(function(el){
      el.addEventListener('click', function(){ clickErrorLine(parseInt(el.dataset.q,10), parseInt(el.dataset.line,10)); });
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clickErrorLine(parseInt(el.dataset.q,10), parseInt(el.dataset.line,10)); }
      });
    });
    // Prev/Next
    document.querySelectorAll('[data-role="prev"]').forEach(function(btn){
      btn.addEventListener('click', function(){ showQuestion(Math.max(0, parseInt(btn.dataset.q,10) - 1)); });
    });
    document.querySelectorAll('[data-role="next"]').forEach(function(btn){
      btn.addEventListener('click', function(){ nextOrFinish(parseInt(btn.dataset.q,10)); });
    });
  }

  /* ==================== REGISTRO DE RESPOSTA ==================== */
  function registerAnswer(qIdx, isOk, expText){
    if(userAnswers[qIdx] !== undefined) return;
    userAnswers[qIdx] = { ok: isOk };
    var fb = document.getElementById('fb-' + qIdx);
    fb.className = 'feedback-box show ' + (isOk ? 'ok' : 'no');
    fb.innerHTML = '<strong>' + (isOk ? '✅ Resposta Correta!' : '❌ Resposta Incorreta.') + '</strong><br>' + escapeHTML(expText);
    var dot = document.getElementById('dot-' + qIdx);
    if(dot) dot.className = 'nav-dot ' + (isOk ? 'done-ok' : 'done-no');
    if(isOk){ score += 100 + (streak * 20); streak++; } else { streak = 0; }
    updateHUD();
  }

  function disableQuestionControls(qIdx){
    var card = document.getElementById('q-card-' + qIdx);
    if(!card) return;
    card.querySelectorAll('.opt-btn').forEach(function(b){ b.disabled = true; });
    card.querySelectorAll('input, select, .btn-action:not([data-role="prev"]):not([data-role="next"])').forEach(function(el){
      if(el.tagName === 'BUTTON' && (el.dataset.role === 'prev' || el.dataset.role === 'next')) return;
      el.disabled = true;
    });
    card.querySelectorAll('.btn-sort').forEach(function(b){ b.disabled = true; });
  }

  /* ==================== TIPOS DE QUESTÃO ==================== */
  function checkChoice(qIdx, optIdx){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var isOk = q.options[optIdx].ok;
    var btns = document.querySelectorAll('#q-card-' + qIdx + ' .opt-btn');
    btns.forEach(function(b, i){
      b.disabled = true;
      if(q.options[i].ok) b.classList.add('correct');
      else if(i === optIdx) b.classList.add('wrong');
    });
    registerAnswer(qIdx, isOk, q.exp);
  }

  function checkTF(qIdx, val){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var isOk = (q.ok === val);
    var btns = document.querySelectorAll('#q-card-' + qIdx + ' .opt-btn');
    btns.forEach(function(b){ b.disabled = true; });
    if(val === true) btns[0].classList.add(isOk ? 'correct' : 'wrong');
    else btns[1].classList.add(isOk ? 'correct' : 'wrong');
    registerAnswer(qIdx, isOk, q.exp);
  }

  function toggleMulti(qIdx, oIdx){
    if(userAnswers[qIdx] !== undefined) return;
    if(!multiState[qIdx]) multiState[qIdx] = new Set();
    var set = multiState[qIdx];
    var btn = document.querySelectorAll('#multi-opts-' + qIdx + ' .opt-btn')[oIdx];
    if(set.has(oIdx)){
      set.delete(oIdx);
      btn.classList.remove('selected-multi');
      btn.setAttribute('aria-pressed','false');
      btn.querySelector('.chk-box').textContent = '⬜';
    } else {
      set.add(oIdx);
      btn.classList.add('selected-multi');
      btn.setAttribute('aria-pressed','true');
      btn.querySelector('.chk-box').textContent = '☑️';
    }
  }

  function checkMulti(qIdx){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var chosen = multiState[qIdx] || new Set();
    var correctIndices = q.options.map(function(o, i){ return o.ok ? i : null; }).filter(function(i){ return i !== null; });
    var isOk = correctIndices.length === chosen.size && correctIndices.every(function(i){ return chosen.has(i); });
    var btns = document.querySelectorAll('#multi-opts-' + qIdx + ' .opt-btn');
    btns.forEach(function(b, i){
      b.disabled = true;
      if(q.options[i].ok && chosen.has(i)){ b.className = 'opt-btn correct'; b.querySelector('.chk-box').textContent = '✅'; }
      else if(q.options[i].ok && !chosen.has(i)){ b.className = 'opt-btn missed'; b.querySelector('.chk-box').textContent = '⚠️'; }
      else if(!q.options[i].ok && chosen.has(i)){ b.className = 'opt-btn wrong'; b.querySelector('.chk-box').textContent = '❌'; }
    });
    var confirmBtn = document.getElementById('multi-confirm-' + qIdx);
    if(confirmBtn){ confirmBtn.disabled = true; }
    registerAnswer(qIdx, isOk, q.exp);
  }

  function checkInput(qIdx){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var input = document.getElementById('input-' + qIdx);
    var raw = input.value.trim();
    if(!raw){
      var fb = document.getElementById('fb-' + qIdx);
      fb.className = 'feedback-box show warn';
      fb.innerHTML = '<strong>⚠️ Digite uma resposta antes de confirmar.</strong>';
      return;
    }
    input.disabled = true;
    var isOk = false;
    if(q.type === 'number'){
      var num = parseFloat(raw.replace(',','.').replace(/[^\d.\-]/g,''));
      isOk = (num === q.answer);
    } else {
      var normRaw = normalizeText(raw);
      var normAns = normalizeText(q.answer);
      // aceita singular/plural simples e substring controlada
      if(normRaw === normAns || normRaw.indexOf(normAns) !== -1) isOk = true;
      else if(normRaw + 's' === normAns || normAns + 's' === normRaw) isOk = true;
    }
    input.style.borderColor = isOk ? 'var(--ok)' : 'var(--no)';
    var confirmBtn = input.parentElement.querySelector('[data-role="input-confirm"]');
    if(confirmBtn) confirmBtn.disabled = true;
    registerAnswer(qIdx, isOk, q.exp);
  }

  function moveSort(qIdx, iIdx, dir){
    if(userAnswers[qIdx] !== undefined) return;
    var list = document.getElementById('sort-list-' + qIdx);
    var items = Array.from(list.children);
    var targetIdx = iIdx + dir;
    if(targetIdx < 0 || targetIdx >= items.length) return;
    if(dir === 1) list.insertBefore(items[targetIdx], items[iIdx]);
    else list.insertBefore(items[iIdx], items[targetIdx]);
    // Atualiza data-pos de acordo com a nova ordem DOM
    Array.from(list.children).forEach(function(el, newI){
      el.dataset.pos = newI;
      var btns = el.querySelectorAll('.btn-sort');
      btns[0].dataset.pos = newI;
      btns[1].dataset.pos = newI;
    });
  }

  function checkSort(qIdx){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var list = document.getElementById('sort-list-' + qIdx);
    // Compara a ordem DOM visual com a ordem correta (índices originais)
    var currentPositions = Array.from(list.children).map(function(c){ return parseInt(c.dataset.pos, 10); });
    // currentPositions agora reflete a ordem DOM: [data-pos do 1º, data-pos do 2º, ...]
    // Para acertar, a sequência de data-pos deve ser exatamente correctOrder
    var isOk = currentPositions.length === q.correctOrder.length &&
               currentPositions.every(function(val, i){ return val === q.correctOrder[i]; });
    list.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
    var checkBtn = document.querySelector('[data-role="sort-check"][data-q="' + qIdx + '"]');
    if(checkBtn) checkBtn.disabled = true;
    registerAnswer(qIdx, isOk, q.exp);
  }

  function clickMatch(qIdx, side, val){
    if(userAnswers[qIdx] !== undefined) return;
    if(!matchState[qIdx]) matchState[qIdx] = { l:null, r:null, matches:{}, wrongCount:0 };
    var st = matchState[qIdx];
    var q = DATABASE[qIdx];

    if(side === 'l'){
      if(st.matches[val]) return; // já pareado
      document.querySelectorAll('#match-l-' + qIdx + ' .match-btn').forEach(function(b){ b.classList.remove('selected'); });
      st.l = val;
      var elL = document.querySelector('#match-l-' + qIdx + ' [data-idx="' + val + '"]');
      if(elL) elL.classList.add('selected');
    } else {
      if(Object.values(st.matches).indexOf(val) !== -1) return;
      document.querySelectorAll('#match-r-' + qIdx + ' .match-btn').forEach(function(b){ b.classList.remove('selected'); });
      st.r = val;
      var elR = document.querySelector('#match-r-' + qIdx + ' [data-val="' + val + '"]');
      if(elR) elR.classList.add('selected');
    }

    if(st.l !== null && st.r !== null){
      var isCorrectPair = (q.pairs[st.l].right === st.r);
      var elLeft = document.querySelector('#match-l-' + qIdx + ' [data-idx="' + st.l + '"]');
      var elRight = document.querySelector('#match-r-' + qIdx + ' [data-val="' + st.r + '"]');

      if(isCorrectPair){
        elLeft.classList.add('matched');
        elRight.classList.add('matched');
        st.matches[st.l] = st.r;
      } else {
        // Feedback visual de erro temporário e permite nova tentativa
        elLeft.classList.add('temp-wrong');
        elRight.classList.add('temp-wrong');
        setTimeout(function(){
          elLeft.classList.remove('temp-wrong');
          elRight.classList.remove('temp-wrong');
        }, 600);
        st.wrongCount++;
      }
      st.l = null; st.r = null;
      document.querySelectorAll('#q-card-' + qIdx + ' .match-btn').forEach(function(b){ b.classList.remove('selected'); });

      // Só finaliza quando todos os pares estiverem corretos
      if(Object.keys(st.matches).length === q.pairs.length){
        registerAnswer(qIdx, st.wrongCount === 0, q.exp);
      }
    }
  }

  function pickChip(qIdx, chipIdx){
    if(userAnswers[qIdx] !== undefined) return;
    if(!bucketState[qIdx]) bucketState[qIdx] = { selected:null, assigned:{} };
    bucketState[qIdx].selected = chipIdx;
    document.querySelectorAll('#q-card-' + qIdx + ' .chip-item').forEach(function(c){
      var parts = c.id.split('-');
      if(parseInt(parts[1],10) === qIdx && parseInt(parts[2],10) === chipIdx) c.classList.add('active-chip');
      else c.classList.remove('active-chip');
    });
  }

  function placeChip(qIdx, bucketIdx){
    if(userAnswers[qIdx] !== undefined) return;
    var st = bucketState[qIdx];
    if(!st || st.selected === null) return;
    var chipEl = document.getElementById('chip-' + qIdx + '-' + st.selected);
    if(!chipEl) return;
    var targetBucket = document.getElementById('b-items-' + qIdx + '-' + bucketIdx);
    targetBucket.appendChild(chipEl);
    chipEl.classList.remove('active-chip');
    st.assigned[st.selected] = bucketIdx;
    st.selected = null;
  }

  function checkBuckets(qIdx){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var st = bucketState[qIdx] || { assigned:{} };
    var allAssigned = q.items.every(function(it, i){ return st.assigned[i] !== undefined; });
    var fb = document.getElementById('fb-' + qIdx);
    if(!allAssigned){
      fb.className = 'feedback-box show warn';
      fb.innerHTML = '<strong>⚠️ Distribua todos os itens nos cestos antes de conferir!</strong>';
      return;
    }
    var isOk = q.items.every(function(it, i){ return st.assigned[i] === it.b; });
    var checkBtn = document.querySelector('[data-role="bucket-check"][data-q="' + qIdx + '"]');
    if(checkBtn) checkBtn.disabled = true;
    registerAnswer(qIdx, isOk, q.exp);
  }

  function checkGap(qIdx){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var sel = document.getElementById('gap-sel-' + qIdx);
    if(!sel.value){
      var fb = document.getElementById('fb-' + qIdx);
      fb.className = 'feedback-box show warn';
      fb.innerHTML = '<strong>⚠️ Escolha uma opção antes de confirmar.</strong>';
      return;
    }
    var isOk = (sel.value === q.correct);
    sel.disabled = true;
    var checkBtn = document.querySelector('[data-role="gap-check"][data-q="' + qIdx + '"]');
    if(checkBtn) checkBtn.disabled = true;
    registerAnswer(qIdx, isOk, q.exp);
  }

  function clickHotspot(qIdx, eraName, el){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var isOk = (eraName === q.target);
    document.querySelectorAll('#q-card-' + qIdx + ' .evo-card').forEach(function(c){
      c.classList.remove('picked','ok','no');
      c.style.pointerEvents = 'none';
    });
    el.classList.add('picked');
    el.classList.add(isOk ? 'ok' : 'no');
    registerAnswer(qIdx, isOk, q.exp);
  }

  function clickErrorLine(qIdx, lineIdx){
    if(userAnswers[qIdx] !== undefined) return;
    var q = DATABASE[qIdx];
    var isOk = (lineIdx === q.errLine);
    var lines = document.querySelectorAll('#q-card-' + qIdx + ' .code-line');
    lines.forEach(function(l){ l.classList.add('locked'); l.style.pointerEvents = 'none'; });
    lines[lineIdx].classList.add('selected-err');
    registerAnswer(qIdx, isOk, q.exp);
  }

  /* ==================== NAVEGAÇÃO ==================== */
  function nextOrFinish(idx){
    if(idx < DATABASE.length - 1){
      showQuestion(idx + 1);
    } else {
      var answered = Object.keys(userAnswers).length;
      var msg = answered < DATABASE.length
        ? 'Você ainda tem ' + (DATABASE.length - answered) + ' questão(ões) sem responder. Finalizar mesmo assim?'
        : 'Finalizar o desafio e ver o relatório?';
      abrirModal(msg).then(function(ok){
        if(ok) showFinalReport();
      });
    }
  }

  /* ==================== RELATÓRIO FINAL ==================== */
  function showFinalReport(){
    document.getElementById('questions-viewport').style.display = 'none';
    document.getElementById('dots-container').style.display = 'none';
    var report = document.getElementById('final-report');
    report.classList.add('show');
    var total = DATABASE.length;
    var correctCount = Object.keys(userAnswers).filter(function(k){ return userAnswers[k].ok; }).length;
    var pct = Math.round((correctCount / total) * 100);
    document.getElementById('final-score-txt').textContent = correctCount + ' / ' + total;
    var badge = document.getElementById('final-feedback-badge');
    if(pct >= 85){ badge.textContent = '🏆 Nível Ouro: Domínio pleno do Tema 01!'; badge.style.color = 'var(--ok)'; }
    else if(pct >= 65){ badge.textContent = '👏 Nível Prata: Bom rendimento! Revise os pontos com erro.'; badge.style.color = 'var(--accent)'; }
    else { badge.textContent = '📖 Nível Bronze: Recomenda-se refazer a leitura e o quiz.'; badge.style.color = 'var(--no)'; }
    var repText = '====================================================\n';
    repText += 'RELATÓRIO OFICIAL: DESAFIO TEMA 01 (20 QUESTÕES)\n';
    repText += 'Acertos: ' + correctCount + ' de ' + total + ' (' + pct + '%) • Pontuação: ' + score + ' pts\n';
    repText += 'Data: ' + new Date().toLocaleString('pt-BR') + '\n';
    repText += '----------------------------------------------------\n';
    DATABASE.forEach(function(q, i){
      var status = userAnswers[i] && userAnswers[i].ok ? '[ACERTO]' : '[ERRO]';
      repText += 'Q' + String(i + 1).padStart(2, '0') + ': ' + status + ' - ' + q.badge.split('•')[0].trim() + '\n';
    });
    repText += '====================================================';
    document.getElementById('report-copy-box').value = repText;
    report.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ==================== AÇÕES DO RELATÓRIO ==================== */
  document.getElementById('btn-copy-rep').addEventListener('click', function(){
    var box = document.getElementById('report-copy-box');
    var btn = document.getElementById('btn-copy-rep');
    var original = '📋 Copiar Resumo';
    function sucesso(){ btn.textContent = '✅ Copiado com Sucesso!'; setTimeout(function(){ btn.textContent = original; }, 2000); }
    function fallback(){
      box.select();
      try { document.execCommand('copy'); sucesso(); } catch(e){ btn.textContent = '❌ Erro ao copiar'; setTimeout(function(){ btn.textContent = original; }, 2000); }
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(box.value).then(sucesso).catch(fallback);
    } else {
      fallback();
    }
  });

  document.getElementById('btn-revisar').addEventListener('click', function(){
    document.getElementById('final-report').classList.remove('show');
    document.getElementById('questions-viewport').style.display = 'block';
    document.getElementById('dots-container').style.display = 'flex';
    showQuestion(curQ);
  });

  document.getElementById('btn-reiniciar').addEventListener('click', function(){
    abrirModal('Reiniciar o desafio? Todas as respostas serão apagadas.').then(function(ok){
      if(ok) location.reload();
    });
  });

  /* ==================== INIT ==================== */
  function initApp(){
    renderNavDots();
    renderAllQuestions();
    showQuestion(0);
  }

  if(document.readyState === 'loading'){
    window.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
})();
</script>
</body>
</html>
